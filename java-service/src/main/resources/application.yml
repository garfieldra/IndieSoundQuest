spring:
  application:
    name: indie-sound-quest-java-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/indie_sound_quest}
    username: ${SPRING_DATASOURCE_USERNAME:indie_sound_quest}
    password: ${SPRING_DATASOURCE_PASSWORD:indie_sound_quest}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

agent:
  internal:
    base-url: ${AGENT_INTERNAL_BASE_URL:http://agent-service:8000}
    service-token: ${AGENT_INTERNAL_SERVICE_TOKEN:change-me}

musicbrainz:
  base-url: ${MUSICBRAINZ_BASE_URL:https://musicbrainz.org/ws/2}
  user-agent: ${MUSICBRAINZ_USER_AGENT:IndieSoundQuest/0.1 (https://github.com/garfieldra/IndieSoundQuest)}

listening:
  apple:
    base-url: ${APPLE_ITUNES_SEARCH_BASE_URL:https://itunes.apple.com/search}
    storefront: ${APPLE_ITUNES_STOREFRONT:CN}
    user-agent: ${APPLE_ITUNES_USER_AGENT:IndieSoundQuest/0.1}
    available-cache-hours: ${APPLE_PREVIEW_AVAILABLE_CACHE_HOURS:168}
    unavailable-cache-hours: ${APPLE_PREVIEW_UNAVAILABLE_CACHE_HOURS:24}
