spring:
  application:
    name: indie-sound-quest-java-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/indie_sound_quest}
    username: ${SPRING_DATASOURCE_USERNAME:indie_sound_quest}
    password: ${SPRING_DATASOURCE_PASSWORD:indie_sound_quest}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    async:
      request-timeout: 15m
  data:
    redis:
      url: ${SPRING_DATA_REDIS_URL:redis://localhost:6379/0}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:indiesoundquest}
    password: ${SPRING_RABBITMQ_PASSWORD:indiesoundquest}
    publisher-confirm-type: correlated
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false

springdoc:
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

resilience4j:
  circuitbreaker:
    instances:
      reportAgent:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
  timelimiter:
    instances:
      reportAgent:
        timeoutDuration: 320s
  retry:
    instances:
      tournamentVote:
        maxAttempts: 3
        waitDuration: 50ms
        retryExceptions:
          - org.springframework.orm.ObjectOptimisticLockingFailureException
  endpoint:
    health:
      probes:
        enabled: true

agent:
  internal:
    base-url: ${AGENT_INTERNAL_BASE_URL:http://agent-service:8000}
    service-token: ${AGENT_INTERNAL_SERVICE_TOKEN:change-me}

musicbrainz:
  base-url: ${MUSICBRAINZ_BASE_URL:https://musicbrainz.org/ws/2}
  user-agent: ${MUSICBRAINZ_USER_AGENT:IndieSoundQuest/0.1 (https://github.com/garfieldra/IndieSoundQuest)}

indie:
  redis:
    idempotency-ttl: 24h
    provider-cache-ttl: 6h
    tournament-state-ttl: 5m
    rate-limit:
      tournament-create-per-minute: 10
      vote-per-minute: 120
      report-per-minute: 5
      conversation-message-per-minute: 30
      exploration-report-per-minute: 5
      agent-run-answer-per-minute: 20

listening:
  apple:
    base-url: ${APPLE_ITUNES_SEARCH_BASE_URL:https://itunes.apple.com/search}
    storefront: ${APPLE_ITUNES_STOREFRONT:CN}
    user-agent: ${APPLE_ITUNES_USER_AGENT:IndieSoundQuest/0.1}
    available-cache-hours: ${APPLE_PREVIEW_AVAILABLE_CACHE_HOURS:168}
    unavailable-cache-hours: ${APPLE_PREVIEW_UNAVAILABLE_CACHE_HOURS:24}
