name: indie-sound-quest

services:
  web:
    build:
      context: ../web
    ports:
      - "5173:5173"
    depends_on:
      java-service:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: /api
    networks:
      - public
      - internal

  java-service:
    build:
      context: ../java-service
      # Always package the current source inside Docker. Copying target/*.jar here
      # can silently run a stale local artifact even after tests compile new code.
      target: runtime
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_URL: redis://redis:6379/0
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-indiesoundquest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:-indiesoundquest}
      AGENT_INTERNAL_BASE_URL: http://agent-service:8000
      AGENT_INTERNAL_SERVICE_TOKEN: ${AGENT_INTERNAL_SERVICE_TOKEN}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - public
      - internal

  agent-service:
    build:
      context: ../agent-service
    environment:
      JAVA_INTERNAL_BASE_URL: http://java-service:8080
      AGENT_INTERNAL_SERVICE_TOKEN: ${AGENT_INTERNAL_SERVICE_TOKEN}
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_MODEL: ${LLM_MODEL}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      BOCHA_API_KEY: ${BOCHA_API_KEY:-}
      SPOTIFY_DISCOVERY_ENABLED: ${SPOTIFY_DISCOVERY_ENABLED:-false}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_MARKET: ${SPOTIFY_MARKET:-}
      MILVUS_URI: ${MILVUS_URI}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      HF_HOME: /cache/huggingface
      FASTEMBED_CACHE_PATH: /cache/fastembed
      ZHIHU_RESEARCH_ENABLED: ${ZHIHU_RESEARCH_ENABLED:-false}
      BILIBILI_RESEARCH_ENABLED: ${BILIBILI_RESEARCH_ENABLED:-false}
      DOUBAN_RESEARCH_ENABLED: ${DOUBAN_RESEARCH_ENABLED:-false}
      ZHIHU_RESEARCH_BASE_URL: http://zhihu-research:8091
      BILIBILI_RESEARCH_BASE_URL: http://bilibili-research:8092
      DOUBAN_RESEARCH_BASE_URL: http://douban-research:8093
      DOMESTIC_RESEARCH_MAX_CALLS: ${DOMESTIC_RESEARCH_MAX_CALLS:-4}
      DOMESTIC_RESEARCH_TIMEOUT_SECONDS: ${DOMESTIC_RESEARCH_TIMEOUT_SECONDS:-12}
      DOMESTIC_RESEARCH_MAX_SOURCES: ${DOMESTIC_RESEARCH_MAX_SOURCES:-8}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      java-service:
        condition: service_healthy
      milvus:
        condition: service_started
    networks:
      - internal
      - public
    volumes:
      - agent-model-cache:/cache

  zhihu-research:
    profiles: ["domestic-research"]
    build:
      context: ../zhihu-research
    environment:
      # Official Zhihu Open Platform credential. Keep it in an ignored .env or
      # deployment secret store; the agent service never receives this value.
      ZHIHU_ACCESS_SECRET: ${ZHIHU_ACCESS_SECRET:-}
    networks:
      - internal
      - research-egress

  bilibili-research:
    profiles: ["domestic-research"]
    build:
      context: ../bilibili-research
    networks:
      - internal
      - research-egress

  douban-research:
    profiles: ["domestic-research"]
    build:
      context: ../douban-research
    networks:
      - internal
      - research-egress

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - redis-data:/data
    networks:
      - internal

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-indiesoundquest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-indiesoundquest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      # The Erlang diagnostics process can take several seconds while the
      # broker is recovering.  A 5-second/10-second loop piles up diagnostics
      # processes and can itself make RabbitMQ unhealthy.
      interval: 30s
      timeout: 20s
      retries: 12
      start_period: 30s
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - internal

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes: ["./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro"]
    networks: [internal]
  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./observability/tempo.yaml:/etc/tempo.yaml:ro", "tempo-data:/tmp/tempo"]
    networks: [internal]
  prometheus:
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: ["./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro"]
    networks: [internal]
  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    depends_on: [prometheus, tempo]
    networks: [public, internal]

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    command: >-
      etcd -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - etcd-data:/etcd
    networks:
      - internal

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: minio server /minio_data
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio-data:/minio_data
    networks:
      - internal

  milvus:
    image: milvusdb/milvus:v2.4.23
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on:
      - etcd
      - minio
    volumes:
      - milvus-data:/var/lib/milvus
    networks:
      - internal

networks:
  public:
  internal:
    internal: true
  # Research sidecars need DNS/HTTPS egress for public read-only sources, but
  # expose no host ports and do not share the application public network.
  research-egress:

volumes:
  mysql-data:
  redis-data:
  etcd-data:
  minio-data:
  milvus-data:
  agent-model-cache:
  rabbitmq-data:
  tempo-data:
