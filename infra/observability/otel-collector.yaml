receivers:
  otlp:
    protocols:
      # Collector runs in its own container.  Explicit wildcard listeners are
      # required: the upstream defaults bind to localhost, which makes the
      # endpoint invisible to Java/Python containers on the internal network.
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlp/tempo]
